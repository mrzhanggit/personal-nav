<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>终端骑士 · CLI 两周通关课程</title>
<style>
  :root{
    --bg:#0b0f1a; --bg2:#101627; --panel:#141c30; --panel2:#1a2440;
    --line:#243050; --tx:#dbe4f5; --tx2:#8fa0c4; --mut:#5c6b8f;
    --acc:#2ee6a8; --acc2:#7dd3fc; --gold:#fbbf24; --rose:#fb7185; --vio:#a78bfa;
    --mono:'SF Mono','Menlo','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:radial-gradient(1200px 800px at 70% -10%,#16203a 0%,var(--bg) 55%) fixed;color:var(--tx);font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}
  ::selection{background:rgba(46,230,168,.25)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .wrap{max-width:1060px;margin:0 auto;padding:24px 20px 80px}

  /* ===== header ===== */
  .top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  .crest{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#173053,#0e2b3d);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--acc);box-shadow:0 0 24px rgba(46,230,168,.18)}
  .title{font-size:22px;font-weight:700;letter-spacing:.5px}
  .title small{display:block;font-size:12px;color:var(--tx2);font-weight:400;margin-top:3px;letter-spacing:2px}
  .hud{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .pill{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:13px;color:var(--tx2);display:flex;gap:7px;align-items:center}
  .pill b{color:var(--gold);font-family:var(--mono)}
  .rankbar{margin:16px 0 26px}
  .rankline{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);margin-bottom:6px}
  .rankline b{color:var(--acc)}
  .track{height:10px;border-radius:99px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
  .fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px rgba(46,230,168,.5)}

  .btn{background:linear-gradient(135deg,#1d7a5c,#155f49);color:#eafff7;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:600;transition:.2s;box-shadow:0 4px 14px rgba(46,230,168,.15)}
  .btn:hover{transform:translateY(-1px);filter:brightness(1.15)}
  .btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--tx2)}
  .btn.ghost:hover{color:var(--tx)}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
  .btn.small{padding:6px 12px;font-size:12px;border-radius:8px}

  /* ===== map ===== */
  .weeks{display:grid;gap:26px}
  .week{background:linear-gradient(180deg,rgba(20,28,48,.7),rgba(16,22,39,.5));border:1px solid var(--line);border-radius:18px;padding:20px 20px 8px}
  .week h3{font-size:14px;color:var(--acc2);letter-spacing:1px;margin-bottom:14px;display:flex;gap:8px;align-items:center}
  .week h3 .wk-tag{font-size:11px;background:rgba(125,211,252,.12);border:1px solid rgba(125,211,252,.3);padding:2px 8px;border-radius:99px}
  .nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:14px}
  .node{position:relative;border-radius:14px;padding:14px 10px 12px;text-align:center;border:1px solid var(--line);background:var(--panel);transition:.25s;overflow:hidden}
  .node .dn{font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:1px}
  .node .nm{font-size:14px;font-weight:600;margin:5px 0 3px}
  .node .st{font-size:11px;color:var(--mut)}
  .node.open{border-color:rgba(46,230,168,.5);cursor:pointer;background:linear-gradient(160deg,var(--panel),rgba(46,230,168,.07))}
  .node.open:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.4)}
  .node.done{border-color:rgba(46,230,168,.55);background:linear-gradient(160deg,var(--panel),rgba(46,230,168,.12))}
  .node.done .st{color:var(--acc)}
  .node.locked{opacity:.42;filter:grayscale(.6)}
  .node.boss{border-color:rgba(251,191,36,.45);background:linear-gradient(160deg,var(--panel),rgba(251,191,36,.08))}
  .node.boss .dn{color:var(--gold)}
  .node .mark{position:absolute;top:8px;right:9px;font-size:12px}
  .node.done .mark{color:var(--acc)}
  .node.open .mark{color:var(--acc2)}

  /* badges */
  .badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
  .badge{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 13px;font-size:12.5px;color:var(--mut);background:var(--panel);transition:.3s}
  .badge .bs{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;background:#0d1424;border:1px solid var(--line);color:#3a4666}
  .badge.won{color:#ffe9b0;border-color:rgba(251,191,36,.45);background:linear-gradient(135deg,rgba(251,191,36,.1),var(--panel))}
  .badge.won .bs{color:var(--gold);border-color:rgba(251,191,36,.5);box-shadow:0 0 10px rgba(251,191,36,.3)}

  /* ===== level page ===== */
  .lv-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .back{color:var(--tx2);font-size:13px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);transition:.2s}
  .back:hover{color:var(--acc)}
  .lv-tag{font-family:var(--mono);font-size:12px;color:var(--gold);letter-spacing:2px}
  .lv-title{font-size:24px;font-weight:700;margin-top:2px}
  .story{background:linear-gradient(135deg,rgba(167,139,250,.1),rgba(125,211,252,.06));border:1px solid rgba(167,139,250,.28);border-radius:14px;padding:16px 18px;font-size:14.5px;line-height:1.85;color:#cfd9f2;margin-bottom:22px}
  .story b{color:#d8c8ff}
  .sect{margin-bottom:26px}
  .sect>h4{font-size:15px;letter-spacing:1px;color:var(--acc2);margin-bottom:12px;display:flex;gap:8px;align-items:center}
  .sect>h4::before{content:"◆";font-size:10px;color:var(--acc)}
  .lesson{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;transition:.2s}
  .lesson:hover{border-color:#31416a}
  .lesson h5{font-size:15px;margin-bottom:8px;color:#eaf4ff}
  .lesson h5 code{color:var(--acc);font-family:var(--mono);background:rgba(46,230,168,.09);padding:2px 8px;border-radius:6px;margin-left:8px;font-size:13px}
  .lesson p{font-size:14px;line-height:1.85;color:var(--tx2)}
  .lesson p b{color:var(--tx)}
  .codeblk{display:flex;align-items:center;gap:10px;background:#0a0e18;border:1px solid #1d2740;border-radius:10px;padding:10px 14px;margin-top:10px;font-family:var(--mono);font-size:13.5px;color:#a9f5d8;overflow-x:auto}
  .codeblk .p{color:#4a5878;user-select:none}
  .codeblk code{white-space:pre}
  .copy{margin-left:auto;font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:3px 9px;transition:.2s;flex-shrink:0}
  .copy:hover{color:var(--acc);border-color:var(--acc)}
  .tip{font-size:12.5px;color:#8fd8bd;background:rgba(46,230,168,.06);border-left:3px solid var(--acc);padding:8px 12px;border-radius:0 8px 8px 0;margin-top:10px;line-height:1.7}

  /* virtual terminal */
  .vterm{background:#070b13;border:1px solid #1d2a45;border-radius:14px;overflow:hidden;box-shadow:0 10px 34px rgba(0,0,0,.45)}
  .vt-bar{display:flex;align-items:center;gap:8px;padding:9px 14px;background:#0d1322;border-bottom:1px solid #1d2a45}
  .dot{width:11px;height:11px;border-radius:50%}
  .vt-bar span.t{margin-left:6px;font-size:12px;color:var(--mut);font-family:var(--mono)}
  .vt-bar .reset{margin-left:auto;font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:3px 10px}
  .vt-bar .reset:hover{color:var(--rose)}
  .vt-out{height:230px;overflow-y:auto;padding:12px 14px;font-family:var(--mono);font-size:13px;line-height:1.65;color:#b8e8d2}
  .vt-out .sys{color:#5c7a95}
  .vt-out .err{color:#ff9d9d}
  .vt-out .in{color:#7dd3fc}
  .vt-out .hl{color:var(--gold)}
  .vt-in{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid #1d2a45;background:#0a0f1a}
  .vt-in .ps{font-family:var(--mono);font-size:13px;color:var(--acc);white-space:nowrap}
  .vt-in input{flex:1;background:none;border:none;outline:none;color:#e8f6ff;font-family:var(--mono);font-size:13px;caret-color:var(--acc)}
  .quest{background:linear-gradient(135deg,rgba(251,191,36,.08),rgba(251,113,133,.05));border:1px solid rgba(251,191,36,.35);border-radius:14px;padding:14px 18px;margin-top:14px;font-size:14px;line-height:1.8;color:#f3e3bb}
  .quest b{color:var(--gold)}
  .quest .qdone{color:var(--acc);font-weight:700}
  .vt-btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}

  /* quiz */
  .qcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .qcard .qn{font-size:12px;color:var(--mut);font-family:var(--mono);margin-bottom:8px;letter-spacing:1px}
  .qcard .qt{font-size:15px;line-height:1.7;margin-bottom:14px}
  .qcard .qt code, .opts code{font-family:var(--mono);background:#0a0e18;border:1px solid #1d2740;color:#a9f5d8;padding:1px 7px;border-radius:6px;font-size:13px}
  .opts{display:grid;gap:9px}
  .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:13.5px;color:var(--tx2);line-height:1.6;transition:.18s;background:#101728}
  .opt:hover:not(.off){border-color:#3a4d7d;color:var(--tx)}
  .opt .oi{font-family:var(--mono);font-size:12px;color:var(--mut);padding-top:2px}
  .opt.right{border-color:var(--acc);background:rgba(46,230,168,.09);color:#d9ffee}
  .opt.wrong{border-color:var(--rose);background:rgba(251,113,133,.08);color:#ffd7dc}
  .opt.off{pointer-events:none}
  .typein{display:flex;gap:10px}
  .typein input{flex:1;background:#0a0e18;border:1px solid #1d2740;border-radius:10px;padding:11px 14px;color:#a9f5d8;font-family:var(--mono);font-size:14px;outline:none}
  .typein input:focus{border-color:var(--acc)}
  .exp{margin-top:12px;font-size:13px;line-height:1.75;color:#a8c4b6;background:rgba(46,230,168,.05);border-left:3px solid var(--acc);padding:9px 13px;border-radius:0 8px 8px 0;display:none}
  .exp.show{display:block}

  /* cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .mcard{perspective:900px;height:120px;cursor:pointer}
  .mcard .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.9,.3,1)}
  .mcard.flip .inner{transform:rotateY(180deg)}
  .mface{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;text-align:center}
  .mf-front{background:linear-gradient(150deg,#182545,#101a30);border:1px solid #2b3a63}
  .mf-front .k{font-family:var(--mono);font-size:15px;color:var(--acc)}
  .mf-front .hint{font-size:10.5px;color:var(--mut);letter-spacing:1px}
  .mf-back{background:linear-gradient(150deg,#123430,#0d2438);border:1px solid rgba(46,230,168,.4);transform:rotateY(180deg);font-size:12px;line-height:1.6;color:#c4e9da;overflow-y:auto}

  /* missions */
  .mission{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--panel);cursor:pointer;transition:.2s}
  .mission:hover{border-color:#31416a}
  .mission .box{width:19px;height:19px;border-radius:6px;border:2px solid #35436b;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:.2s}
  .mission.ok .box{border-color:var(--acc);background:rgba(46,230,168,.15);color:var(--acc)}
  .mission .mt{font-size:13.5px;line-height:1.7;color:var(--tx2)}
  .mission.ok .mt{color:#7fae9b;text-decoration:line-through;text-decoration-color:rgba(46,230,168,.4)}

  /* ordering puzzle */
  .ord-pool{display:flex;flex-direction:column;gap:8px}
  .ord-item{font-family:var(--mono);font-size:13px;text-align:left;background:#101728;border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:#cfe3ff;transition:.18s}
  .ord-item:hover:not(.used){border-color:var(--acc2)}
  .ord-item.used{opacity:.25;pointer-events:none}
  .ord-slots{min-height:60px;border:2px dashed #2b3a63;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .ord-slot{font-family:var(--mono);font-size:13px;background:rgba(125,211,252,.08);border:1px solid rgba(125,211,252,.35);border-radius:10px;padding:10px 14px;color:#dff0ff;display:flex;gap:10px}
  .ord-slot button{margin-left:auto;color:var(--mut);font-size:11px}
  .ord-slot button:hover{color:var(--rose)}
  .ord-slot.ok{border-color:var(--acc);background:rgba(46,230,168,.1)}

  /* level footer */
  .lv-foot{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap;align-items:center}
  .lv-foot .fin{font-size:13px;color:var(--acc)}

  /* toast & modal */
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(80px);background:#0e1a20;border:1px solid var(--acc);color:#d9ffee;padding:12px 22px;border-radius:12px;font-size:14px;z-index:99;transition:.35s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 8px 30px rgba(0,0,0,.5);pointer-events:none}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.gold{border-color:var(--gold);color:#ffe9b0}
  .modal-bg{position:fixed;inset:0;background:rgba(5,8,15,.75);backdrop-filter:blur(6px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-bg.show{display:flex}
  .modal{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:26px;max-width:560px;width:100%;max-height:85vh;overflow-y:auto}
  .modal h3{font-size:17px;margin-bottom:12px;color:var(--gold)}
  .modal p{font-size:13.5px;color:var(--tx2);line-height:1.8;margin-bottom:12px}
  .modal textarea{width:100%;height:110px;background:#0a0e18;border:1px solid #1d2740;border-radius:10px;color:#a9f5d8;font-family:var(--mono);font-size:12px;padding:10px;outline:none;resize:vertical}
  .modal .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

  /* victory */
  .victory{display:none;text-align:center;padding:40px 20px}
  .victory.show{display:block}
  .victory .vc{font-size:60px;color:var(--gold);text-shadow:0 0 40px rgba(251,191,36,.5);margin-bottom:10px}
  .victory h2{font-size:26px;margin-bottom:10px}
  .victory p{color:var(--tx2);line-height:1.9;font-size:14.5px;max-width:520px;margin:0 auto 20px}

  @media (max-width:640px){
    .hud{margin-left:0}
    .nodes{grid-template-columns:repeat(auto-fill,minmax(105px,1fr))}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalBox"></div>
</div>

<script>
/* =========================================================
   终端骑士 · CLI 两周通关课程
   单文件离线 HTML · 无外部依赖 · 进度通过通关码保存
   ========================================================= */

/* ---------- 状态 ---------- */
var S = { xp:0, lv:{}, quiz:{}, chal:{}, miss:{}, badges:{} };
var RANKS = [
  {n:'命令学徒', x:0},{n:'见习骑士', x:120},{n:'文件猎人', x:260},{n:'管道术士', x:480},
  {n:'正则骑士', x:740},{n:'脚本大师', x:1000},{n:'终端宗师', x:1250}
];
var BADGES = [
  {id:'first', n:'初试锋芒', d:'完成第一关'},
  {id:'week1', n:'一周之约', d:'通关第一周全部 7 关'},
  {id:'pipe', n:'管道连击', d:'掌握管道炼金术（第 6 关）'},
  {id:'regex', n:'正则觉醒', d:'领悟正则之道（第 10 关）'},
  {id:'script', n:'脚本出世', d:'写出第一个脚本（第 11 关）'},
  {id:'sys', n:'系统掌控者', d:'完成系统试炼（第 13 关）'},
  {id:'all', n:'终端宗师', d:'14 关全部通关'}
];

/* ---------- 关卡数据 ---------- */
var LEVELS = [
/* ============ DAY 1 ============ */
{ id:1, title:'迷雾森林 · 初识终端', area:'第一周 · 地基', boss:false,
  story:'你踏入 Shell 王国的边境。浓雾中，向导乌鸦开口了：「骑士，鼠标在这里毫无用处。想找到传说中的灯塔，你得学会用<b>文字</b>指挥这个世界。」',
  lessons:[
    {t:'我在哪儿 —— pwd', c:'pwd', b:'pwd 意为 <b>print working directory</b>，打印你当前所在的文件夹路径。迷路时第一反应就是敲它。'},
    {t:'这儿有什么 —— ls', c:'ls\nls -l\nls -a', b:'ls 列出当前文件夹的内容；<b>ls -l</b> 显示详细信息（大小、日期、权限）；<b>ls -a</b> 连隐藏文件一起显示——名字以 <b>.</b> 开头的就是隐藏文件。'},
    {t:'我要去哪儿 —— cd', c:'cd forest\ncd ..\ncd ~\ncd /', b:'cd 是 change directory。`cd 文件夹名` 进入；<b>cd ..</b> 退回上一级；<b>cd ~</b> 回到主目录（你的大本营）；<b>cd /</b> 回到整个磁盘的根。'},
    {t:'架起桥梁 —— open', c:'open .', b:'`open 文件` 等于用鼠标双击它。<b>open .</b> 打开「当前文件夹」的访达窗口——终端与图形世界之间的传送门。'}
  ],
  vfs:{name:'/',type:'d',ch:{
    forest:{type:'d',ch:{
      grove:{type:'d',ch:{
        lighthouse:{type:'d',ch:{'lamp.txt':{type:'f',c:'灯塔亮了。欢迎来到 Shell 王国，骑士。\n记住：Tab 键是你最好的朋友。'}}},
        meadow:{type:'d',ch:{'deer.txt':{type:'f',c:'一只鹿在吃草。它对命令行毫无兴趣。'}}}
      }},
      cave:{type:'d',ch:{'bats.txt':{type:'f',c:'吱吱吱吱。（翻译：里面没有灯塔）'}}}
    }}
  }},
  challenge:{ task:'乌鸦说：灯塔在<b>森林中的树林深处</b>。逐层 cd 探索，最终<b>站进 lighthouse（灯塔）目录里</b>，然后 pwd 确认位置。',
    check:function(sh){ return sh.cwd.indexOf('/forest/grove/lighthouse')===0; } },
  quiz:[
    {q:'敲了 cd forest 之后又敲 cd ..，你现在在哪儿？', o:['forest 的上一级（原地返回）','forest 里面','主目录','报错'], a:0, e:'.. 代表上一级目录，cd .. 就是后退一步。'},
    {q:'哪个命令能显示隐藏文件？', o:['ls -a','ls -h','ls -x','ls hide'], a:0, e:'-a 即 all，显示以 . 开头的隐藏文件。'},
    {q:'刚打开终端，一敲 pwd 出现 /Users/你的名字，这个目录被称为什么？', o:['主目录（home）','根目录','用户盘','系统目录'], a:0, e:'波浪号 ~ 就是它的缩写，cd ~ 随时回到这里。'},
    {q:'亲手打出：列出当前目录内容的命令', type:'ls', e:'ls = list，最朴素的开始。'}
  ],

  lessons:[

    {t:'重复之力', c:"grep -E 'go+d' myth.txt\ngrep -E 'go*d' myth.txt\ngrep -E '[0-9]{3}' myth.txt", b:'<b>+</b> = 前面的东西至少一次（god, good, gooood）；<b>*</b> = 零次或多次；<b>{3}</b> = 恰好三次。'}, 
    {t:'字符集 —— 方括号', c:"grep -E '[AEIOU]' myth.txt\ngrep -E '[0-9]' myth.txt\nls | grep -E '^[a-d]' | head", b:'[...] 匹配方括号里<b>任意一个</b>字符：[0-9] 任一数字，[aeiou] 任一元音，[a-d] a到d任一。'},
    {t:'实战组合拳', c:"grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}' log.txt", b:'这条匹配 yyyy-mm-dd 形式的日期开头行。正则的真身就是把符文按需求拼装——先想清楚“我要匹配的东西长什么样”，再翻译成符文。'}
  ],

/* ---------- 虚拟终端引擎 ---------- */
function VShell(fsInit, cwdInit){
  this.hist=[];
  this.reset(fsInit, cwdInit||'/');
}
VShell.prototype.reset=function(fs,cwd){ this.root=JSON.parse(JSON.stringify(fs)); this.cwd=cwd||'/'; this.hist=[]; };
VShell.prototype.resolve=function(path){
  if(!path) path=this.cwd;
  if(path==='~'||path==='~/') path='/';
  if(path[0]!=='/') path=(this.cwd==='/'?'':this.cwd)+'/'+path;
  var parts=path.split('/').filter(Boolean);
  var stack=[this.root], i, seg, top;
  for(i=0;i<parts.length;i++){
    seg=parts[i];
    if(seg==='.') continue;
    if(seg==='..'){ if(stack.length>1) stack.pop(); continue; }
    top=stack[stack.length-1];
    if(!top.ch || !top.ch[seg]){ return null; }
    stack.push(top.ch[seg]);
  }
  return stack[stack.length-1];
};
VShell.prototype.pathOf=function(p){
  var base=(this.cwd==='/'?'':this.cwd);
  if(p==null) return this.cwd;
  if(p==='~') return '/';
  if(p[0]==='/') return p;
  if(p[0]==='~') return p.slice(1);
  /* normalize with . and .. */
  var abs=(p[0]==='/')?p:(base+'/'+p);
  var st=[]; abs.split('/').filter(Boolean).forEach(function(s){
    if(s==='.')return;
    if(s==='..'){st.pop();return;}
    st.push(s);
  });
  return '/'+st.join('/');
};
VShell.prototype.prompt=function(){ return 'knight'+(this.cwd==='/'?'/':this.cwd)+' $'; };
VShell.prototype.wild=function(pat, names){
  var rx=new RegExp('^'+pat.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.')+'$');
  return names.filter(function(n){ return rx.test(n); });
};
VShell.prototype.filesWithPattern=function(args, cmd){
  /* expand wildcards in file args; return list of {path,node} or null */
  var self=this, out=[], i, a, dirPart, namePart, dirNode, names, m, j;
  var files=[];
  for(i=0;i<args.length;i++){
    a=args[i].replace(/^["']|["']$/g,'');
    if(/[*?]/.test(a)){
      dirPart=a.lastIndexOf('/')>=0? a.slice(0,a.lastIndexOf('/')) : '.';
      namePart=a.slice(a.lastIndexOf('/')+1);
      dirNode=this.resolve(this.pathOf(dirPart===''?'/':dirPart));
      if(!dirNode) return '找不到目录: '+dirPart;
      names=Object.keys(dirNode.ch||{});
      m=this.wild(namePart,names);
      for(j=0;j<m.length;j++) files.push({path:(dirPart==='.'?this.cwd:this.pathOf(dirPart==='/'?'/':dirPart))+'/'+m[j], node:dirNode.ch[m[j]]});
      if(!m.length) return '没有匹配: '+a;
    }else{
      var n=this.resolve(this.pathOf(a));
      if(!n) return cmd+': '+a+': 没有那个文件或目录';
      files.push({path:this.pathOf(a),node:n});
    }
  }
  return files;
};
VShell.prototype.run=function(line){
  this.hist.push(line);
  var segs=[], cur='', q=null, i, ch;
  for(i=0;i<line.length;i++){
    ch=line[i];
    if(q){ cur+=ch; if(ch===q) q=null; continue; }
    if(ch==="'"||ch==='"'){ q=ch; cur+=ch; continue; }
    if(ch==='|'){ segs.push(cur); cur=''; continue; }
    cur+=ch;
  }
  segs.push(cur);
  segs=segs.map(function(s){return s.trim();}).filter(Boolean);
  var stdin=null, out='';
  for(i=0;i<segs.length;i++){
    out=this.exec(segs[i], stdin);
    if(typeof out!=='string'){ return out; } /* special objects */
    stdin=out;
  }
  return out;
};
VShell.prototype.exec=function(cmdline, stdin){
  var parts=cmdline.match(/(?:[^\s"']+|"[^"]*"|'[^']*')+/g)||[];
  var i, redir=null, args=[];
  for(i=0;i<parts.length;i++){
    if(parts[i]==='>'||parts[i]==='>>'){ redir={op:parts[i], file:parts[i+1]||''}; i++; continue; }
    args.push(parts[i]);
  }
  var cmd=args.shift();
  var out;
  if(!cmd) out='';
  else if(cmd==='help') out=this.helpText();
  else if(cmd==='clear') return {clear:true};
  else if(cmd==='history') out=this.hist.slice(-30).map(function(l,idx){return String(idx+1)+'  '+l;}).join('\n');
  else if(cmd==='pwd') out=this.cwd;
  else if(cmd==='whoami') out='knight';
  else if(cmd==='date') out=new Date().toString();
  else if(cmd==='echo') out=args.map(function(a){return a.replace(/^["']|["']$/g,'');}).join(' ');
  else if(cmd==='ls') out=this.ls(args);
  else if(cmd==='cd') out=this.cd(args[0]);
  else if(cmd==='cat'){ var r=this.readFiles(args); if(!Array.isArray(r))return r; out=r.join('\n'); }
  else if(cmd==='head') out=this.headTail(args,stdin,true);
  else if(cmd==='tail') out=this.headTail(args,stdin,false);
  else if(cmd==='wc') out=this.wc(args,stdin);
  else if(cmd==='grep') out=this.grep(args,stdin);
  else if(cmd==='find') out=this.find(args);
  else if(cmd==='sort') out=this.sortC(args,stdin);
  else if(cmd==='uniq') out=this.uniqC(args,stdin);
  else if(cmd==='sed') out=this.sedC(args,stdin);
  else if(cmd==='awk') out=this.awkC(args,stdin);
  else if(cmd==='mkdir') out=this.mkdirC(args);
  else if(cmd==='touch') out=this.touchC(args);
  else if(cmd==='cp') out=this.cpC(args);
  else if(cmd==='mv') out=this.mvC(args);
  else if(cmd==='rm') out=this.rmC(args);
  else out=['骑士，王国的命令书里没有「'+cmd+'」','输入 help 看看可用咒文'].join('\n');
  if(redir && redir.file){
    var dn=this.resolve(this.pathOf(redir.file));
    var path=this.pathOf(redir.file);
    var dirp=path.lastIndexOf('/')>=0?path.slice(0,path.lastIndexOf('/')):this.cwd;
    var base=path.slice(path.lastIndexOf('/')+1);
    var dirNode=this.resolve(dirp===''?'/':dirp)||this.resolve(this.cwd);
    if(!dirNode||dirNode.type!=='d') return '无法写入: '+redir.file;
    var prev=(redir.op==='>>'&&dirNode.ch[base]&&dirNode.ch[base].type==='f')?dirNode.ch[base].c:'';
    dirNode.ch[base]={type:'f',c:prev+(prev&&!prev.endsWith('\n')?'\n':'')+out};
    return '';
  }
  return out===undefined?'':out;
};
VShell.prototype.helpText=function(){
  return ['可用咒文：','  pwd  ls  cd  cat  head  tail  wc','  grep  find  sort  uniq  sed  awk','  mkdir  touch  cp  mv  rm  echo','  history  clear  help','支持管道 | 与重定向 >  >>'];
};
VShell.prototype.ls=function(args){
  var flags=args.filter(function(a){return a[0]==='-';}).join('');
  var target=args.filter(function(a){return a[0]!=='-';})[0];
  var node=this.resolve(this.pathOf(target));
  if(!node) return 'ls: '+(target||'')+'：没有那个目录';
  if(node.type==='f') return target;
  var names=Object.keys(node.ch);
  if(flags.indexOf('a')<0) names=names.filter(function(n){return n[0]!=='.';});
  names.sort();
  if(flags.indexOf('l')>=0){
    return names.map(function(n){var c=node.ch[n];return (c.type==='d'?'d':'-')+'rw-r--r--  knight  '+String((c.c||'').length+64).padStart(6)+'  '+n+(c.type==='d'?'/':'');}).join('\n');
  }
  return names.map(function(n){return n+(node.ch[n].type==='d'?'/':'');}).join('  ');
};
VShell.prototype.cd=function(t){
  if(!t) t='~';
  t=t.replace(/^["']|["']$/g,'');
  var p=this.pathOf(t);
  var node=this.resolve(p);
  if(!node) return 'cd: '+t+'：没有那个目录';
  if(node.type!=='d') return 'cd: '+t+'：不是目录';
  this.cwd=p==='//'?'/':(p||'/');
  return '';
};
VShell.prototype.readFiles=function(args){
  var f=this.filesWithPattern(args,'cat');
  if(typeof f==='string') return f;
  var out=[];
  f.forEach(function(x){ if(x.node.type==='d'){out.push('cat: '+x.path+'：是个目录');} else out.push(x.node.c); });
  return out;
};
VShell.prototype.headTail=function(args,stdin,isHead){
  var n=10, files=[], i;

  L.cards.forEach(function(c){
    var mc=el('div','mcard');
    mc.innerHTML='<div class="inner"><div class="mface mf-front"><div class="k">'+esc(c.k)+'</div><div class="hint">点击查看</div></div><div class="mface mf-back">'+esc(c.b)+'</div></div>';
    mc.onclick=function(){ mc.classList.toggle('flip'); };
    grid.appendChild(mc);
  });
  cds.appendChild(grid);
  app.appendChild(cds);

  /* missions */
  var ms=el('div','sect');
  ms.appendChild(el('h4','','真机任务 · 到你的终端里去'));
  L.missions.forEach(function(m,i){
    var key=L.id+'_'+i;
    var mi=el('div','mission'+(S.miss[key]?' ok':''));
    mi.innerHTML='<div class="box">✓</div><div class="mt">'+m+'</div>';
    mi.onclick=function(){ S.miss[key]=!S.miss[key]; mi.classList.toggle('ok'); };
    ms.appendChild(mi);
  });
  app.appendChild(ms);

  /* footer */
  var ft=el('div','lv-foot');
  var fin=el('div','fin','');
  var finBtn=el('button','btn','完成本关 ✦');
  finBtn.onclick=function(){ finishLevel(L); };
  var nxt=el('button','btn ghost','下一关 →');
  nxt.onclick=function(){ if(L.id<14) renderLevel(L.id+1); else renderMap(); };
  ft.appendChild(finBtn);
  ft.appendChild(nxt);
  ft.appendChild(fin);
  app.appendChild(ft);
  updateFin(fin,L);
  window.scrollTo(0,0);
}
function updateFin(fin,L){
  var qd=quizDoneCount(L), cd=!!S.chal[L.id];
  fin.textContent='进度：试炼'+(cd?'✓':'✗')+' / 答题 '+qd+'/'+L.quiz.length;
}
function finishLevel(L){
  if(S.lv[L.id]){ showToast('本关已通关过'); return; }
  var qd=quizDoneCount(L);
  if(!S.chal[L.id]){ showToast('还差一步：先完成试炼场的任务'); return; }
  if(qd<L.quiz.length){ showToast('还差一步：自测试炼还有 '+(L.quiz.length-qd)+' 题未答对'); return; }
  S.lv[L.id]=1;
  var bonus=L.boss?60:20;
  addXp(bonus,'「'+L.title.split(' · ')[0]+'」通关！');
  checkBadges();
  if(L.id===14){ setTimeout(function(){ renderMap(); },1200); }
  else showToast('关卡完成，地图上点亮下一关', false);
  renderLevel(L.id);
}

/* ---------- terminal widget ---------- */
function buildTerm(){
  var L=curLevel;
  vsh=new VShell(L.vfs,'/');
  var box=el('div','vterm');
  var bar=el('div','vt-bar');
  ['','#','#'].forEach(function(c,i){ var d=el('span','dot'); d.style.background=['#ff5f57','#febc2e','#28c840'][i]; bar.appendChild(d); });
  bar.appendChild(el('span','t','knight-shell · 页内沙盒，放心乱敲'));
  var rst=el('button','reset','重置');
  rst.onclick=function(){ vsh.reset(L.vfs,'/'); renderTermOut(); };
  bar.appendChild(rst);
  box.appendChild(bar);
  var out=el('div','vt-out');
  out.id='vtOut';
  var inrow=el('div','vt-in');
  var ps=el('span','ps','');
  var inp=document.createElement('input');
  inp.id='vtInp'; inp.placeholder='输入命令，回车执行（help 查看可用命令）';
  inrow.appendChild(ps); inrow.appendChild(inp);
  box.appendChild(out); box.appendChild(inrow);
  setTimeout(function(){ renderTermOut(); ps.textContent=vsh.prompt(); },0);
  inp.addEventListener('keydown',function(e){
    if(e.key==='Enter'){
      var line=inp.value.trim();
      inp.value='';
      if(!line) return;
      var p0=vsh.prompt();
      var res=vsh.run(line);
      if(res&&res.clear){ out.innerHTML=''; ps.textContent=vsh.prompt(); return; }
      appendOut('<span class="in">'+esc(p0)+' '+esc(line)+'</span>');
      appendOut(esc(res===''?'':String(res))||'<span class="sys">（无输出）</span>');
      ps.textContent=vsh.prompt();
      checkChallenge();
    }
  });
  return box;
}
function renderTermOut(){
  var out=document.getElementById('vtOut'); if(!out)return;
  out.innerHTML='<span class="sys">欢迎来到试炼场。这是页内沙盒：怎么敲都伤不到真机。\n输入 help 查看可用命令，或直接开始任务。\n</span>';
}
function appendOut(html){
  var out=document.getElementById('vtOut'); if(!out)return;
  var pre=document.createElement('div');
  pre.style.whiteSpace='pre-wrap';
  pre.innerHTML=html.replace(/\n/g,'<br>');
  out.appendChild(pre);
  out.scrollTop=out.scrollHeight;
}
function checkChallenge(){
  var L=curLevel;
  if(!L.challenge||S.chal[L.id]) return;
  try{
    if(L.challenge.check(vsh)){
      S.chal[L.id]=1;
      appendOut('<span class="hl">✦ 试炼达成！获得 30 XP</span>');
      addXp(30,'试炼达成');
      checkBadges();
      var quests=document.querySelectorAll('.quest');
      quests.forEach(function(q){
        if(q.innerHTML.indexOf('任务')>=0&&!q.innerHTML.indexOf('已完成')>=0){}
      });
    }
  }catch(e){}
}

/* ---------- quiz widget ---------- */
function buildQuiz(L,Q,qi,sec){
  var card=el('div','qcard');
  card.appendChild(el('div','qn','QUESTION '+(qi+1)+(L.quiz[qi].type?' · 亲手打出来':'')));
  card.appendChild(el('div','qt',Q.q));
  var exp=el('div','exp','<b>解析：</b>'+Q.e);
  var solved=function(){
    if(!S.quiz[L.id]) S.quiz[L.id]=[];
    if(S.quiz[L.id][qi]) return false;
    S.quiz[L.id][qi]=1;
    addXp(10,'答对');
    return true;
  };
  if(Q.type){
    var row=el('div','typein');
    var inp=document.createElement('input');
    inp.placeholder='在这里敲出命令…';
    var btn=el('button','btn small','提交');
    var submit=function(){
      var v=inp.value.trim().replace(/\s+/g,' ');
      var ans=Q.type.replace(/\s+/g,' ');
      if(v===ans||v===ans.replace(/"/g,"'")){
        if(solved()) { card.style.borderColor='rgba(46,230,168,.6)'; }
        exp.classList.add('show'); updateLevelHead(L);
        showToast('✓ 正确');
      } else {
        exp.classList.add('show');
        showToast('再想想，注意命令和参数的拼写');
      }
    };
    btn.onclick=submit;
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); });
    row.appendChild(inp); row.appendChild(btn);
    card.appendChild(row);
  } else {
    var opts=el('div','opts');
    Q.o.forEach(function(o,oi){
      var b=el('button','opt');
      b.innerHTML='<span class="oi">'+String.fromCharCode(65+oi)+'</span><span>'+o+'</span>';
      b.onclick=function(){
        if(S.quiz[L.id]&&S.quiz[L.id][qi]){ return; }
        var all=opts.querySelectorAll('.opt');
        all.forEach(function(x){x.classList.add('off');});
        if(oi===Q.a){
          b.classList.add('right');
          solved();
          updateLevelHead(L);
          showToast('✓ 正确');
        } else {
          b.classList.add('wrong');
          all[Q.a].classList.add('right');
          showToast('答错了，看解析');
        }
        exp.classList.add('show');
      };
      opts.appendChild(b);
    });
    card.appendChild(opts);
  }
  card.appendChild(exp);
  return card;
}
function updateLevelHead(L){
  var h4s=app.querySelectorAll('.sect h4');
  h4s.forEach(function(h){
    if(h.textContent.indexOf('自测试炼')===0){
      h.textContent='自测试炼 · '+quizDoneCount(L)+'/'+L.quiz.length+' 已答对';
    }
  });
  var fin=app.querySelector('.lv-foot .fin');
  if(fin) updateFin(fin,L);
}

/* ---------- ordering puzzle ---------- */
function buildOrder(){
  var L=curLevel, G=L.orderGame;
  var pool=el('div','ord-pool');
  var slots=el('div','ord-slots');
  slots.appendChild(el('div','','<span style="color:var(--mut);font-size:12px">按顺序点击下方命令行，组装你的咒文：</span>'));
  var chosen=[];
  var idx=G.lines.map(function(_,i){return i;});
  /* deterministic-ish shuffle different from correct order */
  var shuffled=idx.slice();
  do{
    for(var i=shuffled.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=shuffled[i]; shuffled[i]=shuffled[j]; shuffled[j]=t; }
  }while(shuffled.every(function(v,i){return v===i;}));
  function refresh(){
    slots.innerHTML='';
    chosen.forEach(function(ci,pos){
      var s=el('div','ord-slot');
      s.innerHTML='<span style="color:var(--mut)">'+(pos+1)+'</span><code style="white-space:pre-wrap">'+esc(G.lines[ci])+'</code>';
      var x=el('button','','移除');
      x.onclick=function(){ chosen.splice(pos,1); refresh(); };
      s.appendChild(x);
      slots.appendChild(s);
    });
    if(!chosen.length) slots.appendChild(el('div','','<span style="color:var(--mut);font-size:12px">按顺序点击下方命令行，组装你的咒文：</span>'));
    pool.innerHTML='';
    shuffled.forEach(function(ci){
      var used=chosen.indexOf(ci)>=0;
      var it=el('button','ord-item'+(used?' used':''));
      it.innerHTML=esc(G.lines[ci]);
      it.onclick=function(){
        if(used) return;
        chosen.push(ci); refresh();
        if(chosen.length===G.lines.length){
          var ok=chosen.every(function(v,i){return v===i;});
          if(ok){
            if(!S.chal[L.id]){ S.chal[L.id]=1; addXp(30,'拼图达成'); checkBadges(); }
            showToast('✓ 咒文组装正确！',true);
            slots.querySelectorAll('.ord-slot').forEach(function(s){s.classList.add('ok');});
          } else {
            showToast('顺序不对——回想每一步的依赖关系');
          }
        }
      };
      pool.appendChild(it);
    });
  }
  refresh();
  var wrap=el('div');
  wrap.appendChild(slots);
  wrap.appendChild(el('div','','')); 
  wrap.appendChild(pool);
  return wrap;
}

/* ---------- save / load ---------- */
function saveCode(){ try{ return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }catch(e){ return ''; } }
function openSave(){
  modalBox.innerHTML='';
  modalBox.appendChild(el('h3','','通关码存档'));
  modalBox.appendChild(el('p','','本页为离线单文件、不使用浏览器存储。复制下面的通关码妥善保存（可贴进备忘录），下次回来粘贴即可恢复进度。'));
  var ta=document.createElement('textarea');
  ta.value=saveCode(); ta.readOnly=true;
  modalBox.appendChild(ta);
  var row=el('div','row');
  var cp=el('button','btn','复制通关码');
  cp.onclick=function(){ copyCode(cp,ta.value); };
  var ld=el('button','btn ghost','导入通关码');
  ld.onclick=function(){ loadFromTa(ta); };
  var cl=el('button','btn ghost','关闭');
  cl.onclick=function(){ modalBg.classList.remove('show'); };
  row.appendChild(cp); row.appendChild(ld); row.appendChild(cl);
  modalBox.appendChild(row);
  modalBg.classList.add('show');
}
function loadFromTa(ta){
  try{
    var s=JSON.parse(decodeURIComponent(escape(atob(ta.value.trim()))));
    if(typeof s.xp!=='number') throw 0;
    S=s;
    modalBg.classList.remove('show');
    renderMap();
    showToast('进度已恢复，欢迎回来，骑士',true);
  }catch(e){ showToast('通关码无法识别，请检查是否复制完整'); }
}
modalBg.addEventListener('click',function(e){ if(e.target===modalBg) modalBg.classList.remove('show'); });

renderMap();
</script>
